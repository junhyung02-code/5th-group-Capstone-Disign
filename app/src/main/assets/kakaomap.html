<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakao Map</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d0a8a89e743954aae048a07224b60d63"></script>

<script>
    var container = document.getElementById('map');
    var options = {
        // 계명대학교 성서캠퍼스 좌표
        center: new kakao.maps.LatLng(35.858485, 128.486586),
        level: 3
    };

    var map = new kakao.maps.Map(container, options);
</script>
</body>
</html>
